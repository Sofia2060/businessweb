<html>
    <head>
        <title>Travel Expense Report</title>
        <style>
            body {
                display: flex;
                margin: 20px;
                justify-content: center;
            }
            .form-container {
                width: 580px;
                margin: 0 auto;
                background-color: #d8f8ff;
                border: 2px solid #0000ff;
                padding: 20px 35px;
                box-sizing: border-box;
            }
            .header-logo {
            text-align: center;
            margin-bottom: 15px;
            }
            .header-logo img {
                max-width: 100%;
                height: auto;
            }
            h2.title {
                font-size: 22px;
                font-weight: bold;
                margin-top: 0;
                margin-bottom: 10px;
                color: #000000;
            }
            hr {
                border: none;
                border-top: 1px solid #777;
                margin-bottom: 15px;
            }
            .field-group {
                margin-bottom: 12px;
                font-size: 15px;
            }
            textarea {
                width: 100%;
                height: 70px;
                box-sizing: border-box;
                margin-top: 5px;
                font-family: Arial, sans-serif;
            }
            .expense-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 8px;
                margin-bottom: 15px;
                background-color: #d8f8ff;
            }
            .expense-table th, .expense-table td {
                border: 1px solid #70a0a0;
                padding: 4px;
                text-align: center;
            }
            .expense-table th {
                font-weight: bold;
                font-size: 15px;
            }
            .expense-table input[type="text"], 
            .expense-table select {
                width: 95%;
                box-sizing: border-box;
            }
            .button-group {
                margin-top: 15px;
                margin-bottom: 15px;
            }
            .button-group input {
                padding: 3px 10px;
                cursor: pointer;
                margin-right: 5px;
            }
            .footer-text {
                font-size: 14px;
                margin-top: 15px;
            }
        </style>
    </head>
    <body>
        <div class="form-container">
            <div class="header-logo">
                <img src="images/DeLong.jpg" alt="DeLong Enterprises"/>
            </div>
            <h2 class="title">Travel Expense Report</h2>
            <hr/>

            <form name="expenseForm">
                <div class="field-group">
                    1) First Name: <input type="text" name="firstname" size="16">
                    &nbsp;&nbsp;Last Name: <input type="text" name="lastname" size="16"> 
                </div>
                <div class="field-group">
                    2) Social Security Number: <input type="text" name="ssn" size="12">
                </div>
                <div class="field-group">
                    3) Department:
                    <select name="department">
                        <option value="Accounting" selected>Accounting</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                        <option value="HR">Human Resources</option>
                    </select>
                </div>
                <div class="field-group">
                    4) Describe the purpose of your trip.
                    <textarea name="purpose"></textarea>
                </div>
                <div>
                    5) Itemize your travel expenses
                    <table class="expense-table">
                        <thead>
                            <tr>
                                <th style="width: 18%;">Date</th>
                                <th style="width: 44%;">Description</th>
                                <th style="width: 22%;">Category</th>
                                <th style="width: 16%;">Amount</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><input type="date" name="date1" value="mm/dd/yy"></td>
                                <td><input type="text" name="desc1"></td>
                                <td>
                                    <select name="cat1">
                                        <option value="Meal" selected>Meal</option>
                                        <option value="Hotel">Hotel</option>
                                        <option value="Transport">Transport</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </td>
                                <td><input type="text" name="amount1"></td>
                            </tr>
                            <tr>
                                <td><input type="date" name="date2" value="mm/dd/yy"></td>
                                <td><input type="text" name="desc2"></td>
                                <td>
                                    <select name="cat2">
                                        <option value="Meal" selected>Meal</option>
                                        <option value="Hotel">Hotel</option>
                                        <option value="Transport">Transport</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </td>
                                <td><input type="text" name="amount2"></td>
                            </tr>
                            <tr>
                                <td><input type="date" name="date3" value="mm/dd/yy"></td>
                                <td><input type="text" name="desc3"></td>
                                <td>
                                    <select name="cat3">
                                        <option value="Meal" selected>Meal</option>
                                        <option value="Hotel">Hotel</option>
                                        <option value="Transport">Transport</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </td>
                                <td><input type="text" name="amount3"></td>
                            </tr>
                            <tr>
                                <td><input type="date" name="date4" value="mm/dd/yy"></td>
                                <td><input type="text" name="desc4"></td>
                                <td>
                                    <select name="cat4">
                                        <option value="Meal" selected>Meal</option>
                                        <option value="Hotel">Hotel</option>
                                        <option value="Transport">Transport</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </td>
                                <td><input type="text" name="amount4"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="field-group">
                    6) Have you submitted your receipts?
                    <input type="radio" id="yes" name="receipts" value="Yes"><label for="yes">Yes</label>
                    <input type="radio" id="no" name="receipts" value="No"><label for="no">No</label>
                </div>
                <div class="button-group">
                    <input type="submit" value="Submit travel expenses" onclick="alert('Thông báo submit');">
                    <input type="reset" value="Reset">
                </div>
                <div class="footer-text">
                    Questions? Contact Debbie Larson in Accounting (ext. 2150).
                </div>
            </form>
        </div>
    </body>
</html>
