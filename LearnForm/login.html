<html>
    <head>
        <title>Login System</title>
    </head>
    <body>
        <form
            action="https://tranduythanh.com/process.html"
            method="get"
        >
            <h1>Login System</h1>
            <table>
                <tr>
                    <td>
                        <label for="username">Username:</label>
                    </td>
                    <td>
                        <input type="text" id="username">
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="password">Password:</label>
                    </td>
                    <td>
                        <input type="password" id="password">
                    </td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>
                        <input type="checkbox" id="saveinfo">
                        <label for="saveinfo">Save Login Infomation</label>
                    </td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>
                        <input type="submit" value="Login">
                        |
                        <input type="reset" value="Reset">
                        |
                        <button type="reset">Reset 2</button>
                        <button type="button" onclick="this.style.color='red'">Click Me</button>
                    </td>

                </tr>
            </table>
        </form>
        
    </body>
</html>
